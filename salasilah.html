<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peta Salasilah — Susur Galur Keluarga</title>
<style>
  :root{
    --bg0:#0f1117; --bg1:#141824; --bg2:#1e2640; --bg3:#2d3748;
    --emas:#fbbf24; --biru:#3b82f6; --biru-muda:#93c5fd;
    --hijau:#4ade80; --kelabu:#64748b;
    --teks:#e2e8f0; --teks2:#94a3b8;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:Georgia,'Times New Roman',serif;
    background:var(--bg0); color:var(--teks);
    overflow:hidden;
  }

  /* ---------- Bar atas ---------- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; gap:.6rem; flex-wrap:wrap;
    padding:.55rem .9rem;
    background:rgba(15,17,23,.88); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--bg3);
  }
  header .balik{
    color:var(--biru-muda); text-decoration:none; font-size:.9rem;
    padding:.3rem .7rem; border:1px solid var(--bg3); border-radius:999px;
  }
  header .balik:hover{border-color:var(--biru-muda);}
  header h1{font-size:1.05rem; color:var(--emas); font-weight:normal; letter-spacing:1.5px; margin-right:.4rem;}
  .tab-btn{
    font-family:Georgia,serif; font-size:.85rem;
    background:var(--bg2); color:var(--teks);
    border:1px solid var(--bg3); border-radius:999px;
    padding:.32rem .85rem; cursor:pointer;
  }
  .tab-btn.aktif{background:var(--emas); color:var(--bg0); border-color:var(--emas); font-weight:bold;}
  .tab-btn:hover:not(.aktif){border-color:var(--emas);}
  #nota-pohon{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    padding:.45rem .9rem; font-size:.8rem; color:var(--teks2);
    background:rgba(15,17,23,.85); border-top:1px solid var(--bg3);
    text-align:center;
  }
  .lencana{
    display:inline-block; font-family:Arial,sans-serif;
    font-size:.62rem; font-weight:bold; letter-spacing:1px;
    padding:.12rem .5rem; border-radius:999px; text-transform:uppercase;
    vertical-align:middle;
  }
  .lencana.sahih{background:rgba(74,222,128,.15); color:var(--hijau); border:1px solid var(--hijau);}
  .lencana.lisan{background:rgba(251,191,36,.15); color:var(--emas); border:1px solid var(--emas);}
  .lencana.belum{background:rgba(100,116,139,.18); color:#cbd5e1; border:1px dashed var(--kelabu);}

  /* ---------- Kanvas ---------- */
  #svg-pohon{
    position:fixed; inset:0; width:100vw; height:100vh;
    display:block; cursor:grab;
    background:radial-gradient(ellipse at 50% 42%, #1e2640 0%, #141824 52%, #0f1117 100%);
    touch-action:none; /* biar kita kawal seret & cubit sendiri di telefon */
  }
  #svg-pohon:active{cursor:grabbing;}
  .viz-alat{
    position:fixed; right:.8rem; top:50%; transform:translateY(-50%); z-index:20;
    display:flex; flex-direction:column; gap:.4rem;
  }
  .viz-alat button{
    width:42px; height:42px; font-size:1.2rem;
    background:var(--bg2); color:var(--emas);
    border:1px solid var(--emas); border-radius:9px; cursor:pointer; opacity:.9;
  }
  .viz-alat button:hover{opacity:1; background:var(--bg3);}

  /* ---------- Nod ---------- */
  .nod rect{
    fill:var(--bg2); stroke-width:2.5px;
    filter:drop-shadow(0 0 7px rgba(251,191,36,.22));
  }
  .nod.status-sahih rect{stroke:var(--hijau);}
  .nod.status-lisan rect{stroke:var(--emas);}
  .nod.status-belum rect{stroke:var(--kelabu); stroke-dasharray:6 4;}
  .nod text{font-family:Georgia,serif; fill:var(--teks);}
  .nod .nama{font-size:14px; font-weight:bold; fill:var(--emas);}
  .nod .butir{font-size:11px; fill:var(--teks2);}
  .nod .kira{font-size:11px; fill:var(--bg0); font-weight:bold;}
  .nod circle.toggel{
    fill:var(--emas); stroke:var(--bg0); stroke-width:1.5px; cursor:pointer;
    filter:drop-shadow(0 0 6px rgba(251,191,36,.75));
  }
  .nod circle.bingkai-thumb{fill:var(--bg1); stroke:var(--emas); stroke-width:1.5px;}
  .pautan{fill:none; stroke:var(--biru); stroke-width:1.7px; opacity:.5;}
  .gelang{fill:none; stroke:#334155; stroke-dasharray:3 8; opacity:.85;}
  .bintang{fill:#e2e8f0;}

  /* ---------- Kad orang ---------- */
  #kad-orang{
    position:fixed; top:4.2rem; left:.8rem; z-index:30;
    width:min(330px, calc(100vw - 5.8rem));
    background:var(--bg1); border:1px solid var(--emas); border-radius:12px;
    box-shadow:0 8px 32px rgba(15,17,23,.85), 0 0 20px rgba(251,191,36,.28);
    overflow:hidden;
  }
  #kad-tutup{
    position:absolute; top:.4rem; right:.4rem; z-index:2;
    width:30px; height:30px; border:none; border-radius:50%;
    background:rgba(15,17,23,.8); color:var(--krem,#f7f1e3);
    font-size:1.1rem; cursor:pointer; line-height:1;
  }
  #kad-gambar{width:100%; aspect-ratio:16/9; background:var(--bg0);
    display:flex; align-items:center; justify-content:center;}
  #kad-gambar img{width:100%; height:100%; object-fit:cover; display:block;}
  #kad-gambar .inisial{
    width:74px; height:74px; border-radius:50%;
    background:var(--emas); color:var(--bg0);
    display:flex; align-items:center; justify-content:center;
    font-size:1.9rem;
  }
  #kad-isi{padding:.9rem 1rem 1rem;}
  #kad-isi h3{color:var(--emas); font-size:1.1rem; margin-bottom:.15rem; font-weight:normal;}
  #kad-isi p{font-size:.88rem; color:#cbd5e1; margin-bottom:.3rem; line-height:1.55;}
  #kad-pasangan{font-style:italic; color:var(--biru-muda) !important;}

  /* ---------- Mudah alih ---------- */
  @media (max-width: 700px){
    header{
      flex-wrap:nowrap; overflow-x:auto; gap:.45rem;
      padding:.5rem .6rem; -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    header::-webkit-scrollbar{display:none;}
    header h1{font-size:.85rem; letter-spacing:1px; flex:0 0 auto;}
    header .balik{flex:0 0 auto; font-size:.8rem; padding:.25rem .6rem;}
    .tab-btn{flex:0 0 auto; font-size:.78rem; padding:.28rem .7rem;}
    .viz-alat{
      top:auto; bottom:3.6rem; right:.6rem; transform:none;
    }
    .viz-alat button{width:44px; height:44px; font-size:1.25rem;}
    #nota-pohon{font-size:.68rem; padding:.35rem .6rem;}
    #nota-pohon .lencana{display:none;}
    #kad-orang{
      top:auto; bottom:3.4rem; left:.6rem;
      width:calc(100vw - 1.2rem); max-height:62vh; overflow-y:auto;
    }
    #kad-gambar{aspect-ratio:auto; max-height:34vh;}
    #kad-gambar img{height:auto; max-height:34vh; object-fit:contain;}
  }
  #kad-dialog{
    position:relative; margin:.5rem 0 .7rem;
    background:var(--bg2); border:1px solid var(--emas); border-radius:12px;
    padding:.65rem .9rem; font-style:italic; font-size:.92rem; color:var(--emas);
    line-height:1.5;
  }
  #kad-dialog::before{
    content:""; position:absolute; top:-9px; left:26px;
    width:14px; height:14px; background:var(--bg2);
    border-left:1px solid var(--emas); border-top:1px solid var(--emas);
    transform:rotate(45deg);
  }
</style>
</head>
<body>

<header>
  <a class="balik" href="index.html">← Utama</a>
  <h1>PETA SALASILAH</h1>
  <button class="tab-btn aktif" data-pohon="0">Jurai Keluarga Kita</button>
  <button class="tab-btn" data-pohon="1">Jurai Tok Gawo (Besut)</button>
  <button class="tab-btn" data-pohon="2">Jurai Mat Junoh (Sebelah Ibu)</button>
  <button class="tab-btn" data-pohon="3">Jurai Perba Jelai (Pahang)</button>
  <span style="flex:1"></span>
  <button class="tab-btn" id="btn-mod" title="Tukar paparan">▤ Hierarki Penuh</button>
</header>

<svg id="svg-pohon"></svg>

<div class="viz-alat">
  <button id="btn-zoom-in" title="Zum masuk">+</button>
  <button id="btn-zoom-out" title="Zum keluar">−</button>
  <button id="btn-reset" title="Kembali asal">⟳</button>
  <button id="btn-buka-semua" title="Kembang semua" style="font-size:.85rem;">⊕</button>
</div>

<div id="kad-orang" hidden>
  <button id="kad-tutup" title="Tutup">×</button>
  <div id="kad-gambar"></div>
  <div id="kad-isi">
    <h3 id="kad-nama"></h3>
    <p id="kad-pasangan"></p>
    <div id="kad-dialog" hidden></div>
    <p id="kad-butir"></p>
    <p id="kad-kisah"></p>
    <span id="kad-status"></span>
  </div>
</div>

<p id="nota-pohon"></p>

{

        anak:[

/* ==============================================================
   ENJIN PETA ORBIT-HIERARKI
   · Gelang = generasi (yang lebih tua di gelang dalam)
   · Dalam satu keluarga, anak disusun ikut kelahiran —
     sulung dahulu, mengikut arah jam
   · Klik nama → kad visual · klik bulatan ± → kembang/lipat
   · Nod yang ada imej komik dipaparkan dengan thumbnail bulat
   ============================================================== */
(function(){
  var NS = "http://www.w3.org/2000/svg";
  var LEBAR = 190, TINGGI = 62, JX = 205, JRAD = 260;
  var svg = document.getElementById("svg-pohon");

  /* lapisan bintang di belakang */
  var lapisBintang = document.createElementNS(NS,"g");
  svg.appendChild(lapisBintang);
  var lapisan = document.createElementNS(NS,"g");
  svg.appendChild(lapisan);

  function el(tag, attrs, teks){
    var e = document.createElementNS(NS, tag);
    for(var k in attrs){ e.setAttribute(k, attrs[k]); }
    if(teks !== undefined){ e.textContent = teks; }
    return e;
  }

  /* taburan bintang statik */
  (function bintang(){
    var w = window.innerWidth, h = window.innerHeight;
    for(var i = 0; i < 130; i++){
      lapisBintang.appendChild(el("circle",{class:"bintang",
        cx:Math.random()*w, cy:Math.random()*h,
        r:(Math.random()*1.3 + .3).toFixed(2),
        opacity:(Math.random()*.5 + .15).toFixed(2)}));
    }
  })();

  var pand = {x:0, y:0, k:0.8};
  var akar = null, idKlip = 0;
  var mod = "orbit";   /* "orbit" atau "hierarki" */
  var JY = 150;        /* jarak menegak paparan hierarki */
  var STATUS_LABEL = {sahih:"SAHIH", lisan:"TRADISI LISAN", belum:"BELUM PASTI"};
  function SRC(d){ return (typeof THUMB !== "undefined" && THUMB[d.imej]) ? THUMB[d.imej] : (d.imej + ".jpg"); }

  function potong(t, n){ return (t && t.length > n) ? t.slice(0, n-1) + "…" : (t || ""); }
  function guna(){ lapisan.setAttribute("transform",
    "translate(" + pand.x + "," + pand.y + ") scale(" + pand.k + ")"); }

  function sedia(d, aras){
    /* generasi dalam (aras 4 ke bawah) dilipat dahulu — klik ± untuk kembang */
    var n = { data:d, aras:aras, buka:(aras < 4), anak:[] };
    (d.anak || []).forEach(function(a){ n.anak.push(sedia(a, aras+1)); });
    return n;
  }

  /* susunan tidy: daun diberi slot berturutan (urutan = kelahiran),
     induk di tengah anak-anaknya */
  var kiraX;
  function susun(n){
    var tampak = n.buka ? n.anak : [];
    if(!tampak.length){ n.x = kiraX; kiraX += JX; }
    else{
      tampak.forEach(susun);
      n.x = (tampak[0].x + tampak[tampak.length-1].x) / 2;
    }
  }

  var lebarPohon = 0, arasMaks = 0;
  function letak(n){
    if(mod === "hierarki"){
      /* atas ke bawah: paksi-x = slot tidy (sulung di kiri), paksi-y = generasi */
      n.px = n.x - lebarPohon/2;
      n.py = n.aras * JY;
    } else if(n.aras === 0){ n.px = 0; n.py = 0; }
    else{
      /* sudut ikut slot tidy → sulung dahulu, arah jam, bermula dari atas */
      var a = ((n.x + JX/2) / (lebarPohon + JX)) * Math.PI * 2 - Math.PI/2;
      var r = n.aras * JRAD;
      n.px = r * Math.cos(a); n.py = r * Math.sin(a);
    }
    if(n.aras > arasMaks){ arasMaks = n.aras; }
    if(n.buka){ n.anak.forEach(letak); }
  }

  function lukis(){
    while(lapisan.firstChild){ lapisan.removeChild(lapisan.firstChild); }
    kiraX = 0;
    susun(akar);
    lebarPohon = Math.max(kiraX - JX, 1);
    arasMaks = 0;
    letak(akar);

    /* gelang generasi (orbit) atau garis generasi (hierarki) */
    if(mod === "orbit"){
      for(var g1 = 1; g1 <= arasMaks; g1++){
        lapisan.appendChild(el("circle",{class:"gelang",cx:0,cy:0,r:g1*JRAD}));
      }
    } else {
      for(var g2 = 0; g2 <= arasMaks; g2++){
        lapisan.appendChild(el("path",{class:"gelang",
          d:"M"+(-lebarPohon/2 - 120)+","+(g2*JY)+"H"+(lebarPohon/2 + 120)}));
      }
    }

    /* pautan */
    (function jalan(n){
      if(!n.buka){ return; }
      n.anak.forEach(function(a){
        if(mod === "hierarki"){
          var y1 = n.py + TINGGI/2, y2 = a.py - TINGGI/2, ym = (y1+y2)/2;
          lapisan.appendChild(el("path",{class:"pautan",
            d:"M"+n.px+","+y1+"V"+ym+"H"+a.px+"V"+y2}));
        } else {
          var mx = (n.px + a.px)/2 * 1.06, my = (n.py + a.py)/2 * 1.06;
          lapisan.appendChild(el("path",{class:"pautan",
            d:"M"+n.px+","+n.py+" Q"+mx+","+my+" "+a.px+","+a.py}));
        }
        jalan(a);
      });
    })(akar);

    (function nod(n){
      var d = n.data;
      var g = el("g",{class:"nod status-"+(d.status||"belum"),
                      transform:"translate("+n.px+","+n.py+")"});
      g.appendChild(el("rect",{x:-LEBAR/2, y:-TINGGI/2, width:LEBAR, height:TINGGI, rx:11,
                               style:"cursor:pointer"}));

      var adaThumb = !!d.imej;
      var tX = adaThumb ? (-LEBAR/2 + 62) : 0;
      var anchor = adaThumb ? "start" : "middle";

      if(adaThumb){
        idKlip++;
        var cp = el("clipPath",{id:"klip"+idKlip});
        cp.appendChild(el("circle",{cx:-LEBAR/2 + 32, cy:0, r:22}));
        g.appendChild(cp);
        g.appendChild(el("circle",{class:"bingkai-thumb", cx:-LEBAR/2 + 32, cy:0, r:24}));
        var img = el("image",{x:-LEBAR/2 + 32 - 40, y:-22, width:80, height:44,
                              "clip-path":"url(#klip"+idKlip+")",
                              preserveAspectRatio:"xMidYMid slice",
                              style:"pointer-events:none"});
        img.setAttributeNS("http://www.w3.org/1999/xlink","href", SRC(d));
        img.setAttribute("href", SRC(d));
        g.appendChild(img);
      }

      g.appendChild(el("text",{class:"nama","text-anchor":anchor, x:tX, y:-6,
        style:"cursor:pointer"}, potong(d.nama, adaThumb ? 17 : 25)));
      var b1 = d.pasangan ? ("♥ "+d.pasangan) : (d.butir||"");
      g.appendChild(el("text",{class:"butir","text-anchor":anchor, x:tX, y:11},
        potong(b1, adaThumb ? 20 : 32)));
      if(d.pasangan && d.butir){
        g.appendChild(el("text",{class:"butir","text-anchor":anchor, x:tX, y:24},
          potong(d.butir, adaThumb ? 20 : 32)));
      }

      /* lencana penghormatan: ikon bedil pusaka (senapang patah) */
      if(d.ikon === "bedil"){
        var lb = el("g",{transform:"translate("+(LEBAR/2-6)+","+(-TINGGI/2+2)+")",
                         style:"pointer-events:none"});
        lb.appendChild(el("circle",{r:15, fill:"#0f1117", stroke:"var(--emas)","stroke-width":"2",
          filter:"drop-shadow(0 0 6px rgba(251,191,36,.8))"}));
        /* senapang patah: laras terbuka + badan + gagang */
        var sg = el("g",{transform:"translate(-8,1) scale(0.9)"});
        sg.appendChild(el("path",{d:"M0,-1 L11,-6 L12,-4.2 L2,0.6 Z", fill:"var(--emas)"}));      /* laras terpatah ke atas */
        sg.appendChild(el("path",{d:"M1,0 L9,0 L9,2 L1,2 Z", fill:"var(--emas)"}));               /* badan */
        sg.appendChild(el("path",{d:"M9,0 L16,3.5 L14.5,6 L8.5,2 Z", fill:"var(--emas)"}));       /* gagang */
        sg.appendChild(el("circle",{cx:5.5, cy:3.6, r:1.4, fill:"none", stroke:"var(--emas)","stroke-width":"1"})); /* picu */
        lb.appendChild(sg);
        g.appendChild(lb);
        var tt = el("title",{});
        tt.textContent = "Pemegang bedil pusaka keluarga";
        lb.appendChild(tt);
      }

      g.addEventListener("click", function(ev){
        ev.stopPropagation();
        if(baruSeret){ return; }
        bukaKad(d);
      });

      if(n.anak.length){
        var tgl = el("circle",{class:"toggel",r:13,cy:TINGGI/2});
        g.appendChild(tgl);
        g.appendChild(el("text",{class:"kira","text-anchor":"middle",y:TINGGI/2+4,
          style:"pointer-events:none"}, n.buka ? "−" : "+"+n.anak.length));
        tgl.addEventListener("click", function(ev){
          ev.stopPropagation();
          if(baruSeret){ return; }
          var sx = n.px * pand.k + pand.x, sy = n.py * pand.k + pand.y;
          n.buka = !n.buka; lukis();
          pand.x = sx - n.px * pand.k; pand.y = sy - n.py * pand.k; guna();
        });
      }
      lapisan.appendChild(g);
      if(n.buka){ n.anak.forEach(nod); }
    })(akar);
  }

  /* ---------- kad orang ---------- */
  var kad = document.getElementById("kad-orang");
  function bukaKad(d){
    var kn = document.getElementById("kad-nama");
    kn.textContent = d.nama;
    if(d.ikon === "bedil"){
      kn.innerHTML += ' <svg width="26" height="15" viewBox="0 0 18 9" style="vertical-align:-2px" aria-label="Pemegang bedil pusaka"><path d="M0,2 L11,-3 L12,-1.2 L2,3.6 Z" fill="#fbbf24"/><path d="M1,3 L9,3 L9,5 L1,5 Z" fill="#fbbf24"/><path d="M9,3 L16,6.5 L14.5,9 L8.5,5 Z" fill="#fbbf24"/><circle cx="5.5" cy="6.6" r="1.4" fill="none" stroke="#fbbf24" stroke-width="1"/></svg>';
    }
    document.getElementById("kad-pasangan").textContent = d.pasangan ? ("Pasangan: " + d.pasangan) : "";
    document.getElementById("kad-butir").textContent = d.butir || "";
    var dg = document.getElementById("kad-dialog");
    if(d.dialog){ dg.textContent = "\u201C" + d.dialog + "\u201D"; dg.hidden = false; }
    else{ dg.hidden = true; }
    document.getElementById("kad-kisah").textContent = d.kisah || "";
    var st = d.status || "belum";
    var lbl = document.getElementById("kad-status");
    lbl.className = "lencana " + st;
    lbl.textContent = STATUS_LABEL[st] || st;
    var kg = document.getElementById("kad-gambar");
    kg.innerHTML = "";
    if(d.imej){
      var im = document.createElement("img");
      im.src = SRC(d); im.alt = d.nama;
      im.onerror = function(){ kg.innerHTML = ""; kg.appendChild(inisial(d.nama)); };
      kg.appendChild(im);
    } else {
      kg.appendChild(inisial(d.nama));
    }
    kad.hidden = false;
  }
  function inisial(nama){
    var div = document.createElement("div");
    div.className = "inisial";
    div.textContent = (nama||"?").trim().split(/\s+/).slice(0,2).map(function(p){return p[0];}).join("");
    return div;
  }
  document.getElementById("kad-tutup").onclick = function(){ kad.hidden = true; };

  function bina(i){
    var d = DATA_POHON[i];
    document.getElementById("nota-pohon").innerHTML =
      d.nota + ' &nbsp; <span class="lencana sahih">Sahih</span> <span class="lencana lisan">Tradisi Lisan</span> <span class="lencana belum">Belum Pasti</span>';
    akar = sedia(d.akar, 0);
    kad.hidden = true;
    lukis();
    reset();
  }

  function reset(){
    var w = window.innerWidth, h = window.innerHeight;
    if(mod === "hierarki"){
      var kMuat = (w - 120) / (lebarPohon + LEBAR + 240);
      pand.k = Math.max(0.18, Math.min(0.9, kMuat));
      pand.x = w/2; pand.y = 90;
    } else {
      var rMaks = Math.max(arasMaks,1) * JRAD + TINGGI + 60;
      pand.k = Math.max(0.22, Math.min(0.9, (Math.min(w, h)/2 - 30) / rMaks));
      pand.x = w/2; pand.y = h/2;
    }
    guna();
  }

  document.getElementById("btn-mod").onclick = function(){
    if(mod === "orbit"){
      mod = "hierarki";
      /* kembang semua: dari akar sampai cucu-cicit termuda */
      (function buka(n){ n.buka = true; n.anak.forEach(buka); })(akar);
      this.textContent = "☉ Orbit";
    } else {
      mod = "orbit";
      this.textContent = "▤ Hierarki Penuh";
    }
    lukis(); reset();
  };

  /* ---------- pan (seret) — seret bermula selepas gerak > 5px,
     klik selepas seretan disekat dengan bendera baruSeret ---------- */
  var seret = null, baruSeret = false;
  var jari = new Map();          /* jejak jari untuk cubit-zum di telefon */
  var cubit = null;

  function jarakJari(){
    var a = [], it = jari.values();
    for(var v = it.next(); !v.done; v = it.next()){ a.push(v.value); }
    var dx = a[0].x - a[1].x, dy = a[0].y - a[1].y;
    return {d:Math.hypot(dx,dy), mx:(a[0].x+a[1].x)/2, my:(a[0].y+a[1].y)/2};
  }

  svg.addEventListener("pointerdown", function(ev){
    jari.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
    if(jari.size === 2){
      var j = jarakJari();
      cubit = {d:j.d, k:pand.k, px:pand.x, py:pand.y, mx:j.mx, my:j.my};
      seret = null;
    } else if(jari.size === 1){
      seret = {x:ev.clientX, y:ev.clientY, px:pand.x, py:pand.y, gerak:false};
    }
  });
  window.addEventListener("pointermove", function(ev){
    if(jari.has(ev.pointerId)){ jari.set(ev.pointerId, {x:ev.clientX, y:ev.clientY}); }
    if(cubit && jari.size === 2){
      var j = jarakJari();
      var k2 = Math.min(2.5, Math.max(0.15, cubit.k * (j.d / cubit.d)));
      pand.x = j.mx - (cubit.mx - cubit.px) * (k2 / cubit.k);
      pand.y = j.my - (cubit.my - cubit.py) * (k2 / cubit.k);
      pand.k = k2; guna();
      baruSeret = true;
      return;
    }
    if(!seret){ return; }
    var dx = ev.clientX - seret.x, dy = ev.clientY - seret.y;
    if(!seret.gerak && (dx*dx + dy*dy) < 25){ return; }
    seret.gerak = true;
    pand.x = seret.px + dx; pand.y = seret.py + dy;
    guna();
  });
  function lepasJari(ev){
    jari.delete(ev.pointerId);
    if(jari.size < 2){ cubit = null; }
    baruSeret = baruSeret || !!(seret && seret.gerak);
    seret = null;
    if(baruSeret){ setTimeout(function(){ baruSeret = false; }, 150); }
  }
  window.addEventListener("pointerup", lepasJari);
  svg.addEventListener("pointercancel", lepasJari);

  /* ---------- zoom ---------- */
  svg.addEventListener("wheel", function(ev){
    ev.preventDefault();
    var mx = ev.clientX, my = ev.clientY;
    var f = ev.deltaY < 0 ? 1.15 : 0.87;
    var k2 = Math.min(2.5, Math.max(0.15, pand.k * f));
    pand.x = mx - (mx - pand.x) * (k2 / pand.k);
    pand.y = my - (my - pand.y) * (k2 / pand.k);
    pand.k = k2; guna();
  }, {passive:false});

  function zoomTengah(f){
    var mx = window.innerWidth/2, my = window.innerHeight/2;
    var k2 = Math.min(2.5, Math.max(0.15, pand.k * f));
    pand.x = mx - (mx - pand.x) * (k2 / pand.k);
    pand.y = my - (my - pand.y) * (k2 / pand.k);
    pand.k = k2; guna();
  }
  document.getElementById("btn-zoom-in").onclick = function(){ zoomTengah(1.3); };
  document.getElementById("btn-zoom-out").onclick = function(){ zoomTengah(0.77); };
  document.getElementById("btn-reset").onclick = reset;
  document.getElementById("btn-buka-semua").onclick = function(){
    (function buka(n){ n.buka = true; n.anak.forEach(buka); })(akar);
    lukis(); reset();
  };

  document.querySelectorAll(".tab-btn[data-pohon]").forEach(function(b){
    b.onclick = function(){
      document.querySelectorAll(".tab-btn[data-pohon]").forEach(function(x){ x.classList.remove("aktif"); });
      b.classList.add("aktif");
      bina(+b.dataset.pohon);
    };
  });

  window.addEventListener("resize", reset);
  bina(0);
})();
</script>
